name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - name: Determine version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VERSION="0.0.0"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build shaded jar
        run: mvn -B package

      - name: Rename standalone jar
        run: |
          mkdir -p dist
          cp target/swt-lcdproc-client-*-shaded.jar "dist/desklcd-${{ steps.version.outputs.version }}.jar"

      - name: Prepare jpackage input
        run: |
          mkdir -p jpackage-input
          cp target/swt-lcdproc-client-*-shaded.jar jpackage-input/app.jar

      - name: Build .deb with jpackage
        run: |
          jpackage \
            --type deb \
            --input jpackage-input \
            --main-jar app.jar \
            --main-class net.suppressio.desklcd.DeskLCD_Main \
            --name desklcd \
            --app-version "${{ steps.version.outputs.version }}" \
            --vendor suppressio \
            --description "GUI per LCDd/LCDproc" \
            --linux-shortcut \
            --linux-menu-group "System;" \
            --dest dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desklcd-build
          path: dist/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/* \
            --title "${{ github.ref_name }}" \
            --generate-notes
